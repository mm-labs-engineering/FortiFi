events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:3000;
    }

    upstream demo {
        server demo:3001;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=demo:10m rate=20r/s;

    # API server
    server {
        listen 80;
        server_name api.fortifi.local;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Demo site
    server {
        listen 80;
        server_name demo.fortifi.local;

        location / {
            limit_req zone=demo burst=40 nodelay;
            proxy_pass http://demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default server (demo)
    server {
        listen 80 default_server;
        server_name _;

        location / {
            limit_req zone=demo burst=40 nodelay;
            proxy_pass http://demo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
