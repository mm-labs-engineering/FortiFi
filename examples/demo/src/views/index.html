<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiFi demo · Paywall hardening</title>
    <link rel="stylesheet" href="/mm-labs-demo.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">FortiFi<small>Demo</small></a>
                <a class="nav-link" href="https://labs.40millimeter.com/products/fortifi">Millimeter Labs</a>
            </div>
        </div>
    </header>

    <main class="container page">
        <p class="kicker">FF-00 · Paywall demo</p>
        <h1>The HTML stays on the server</h1>
        <p class="lede">Unpaid requests get a teaser. The full article is a second response, and only after a short-lived token checks out.</p>

        <section class="session" aria-label="Session">
            <p class="session-label">Session</p>
            <div class="session-row">
                <input type="text" id="userIdInput" class="user-id-input" placeholder="User ID" value="demo-user-123" autocomplete="off">
                <button id="loadArticlesBtn" class="btn btn-primary" type="button">Use this ID</button>
            </div>
        </section>

        <div id="status" class="status" role="status"></div>
        <div id="loading" class="loading">
            <div class="spinner" aria-hidden="true"></div>
            <p>Loading articles</p>
        </div>

        <section class="catalog" aria-label="Articles">
            <p class="section-label">Articles</p>
            <div id="articlesContainer" class="articles-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>FortiFi · MIT core · <a href="https://labs.40millimeter.com/products/fortifi">Millimeter Labs</a></p>
        </div>
    </footer>

    <script>
        class ArticleApp {
            constructor() {
                this.userId = localStorage.getItem('fortifi_user_id') || 'demo-user-123';
                this.articles = [];
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadArticles();
                this.updateUserIdInput();
            }

            bindEvents() {
                document.getElementById('loadArticlesBtn').addEventListener('click', () => {
                    this.userId = document.getElementById('userIdInput').value.trim();
                    if (!this.userId) {
                        this.showStatus('Enter a user ID', 'error');
                        return;
                    }
                    localStorage.setItem('fortifi_user_id', this.userId);
                    this.loadArticles();
                });
            }

            updateUserIdInput() {
                const input = document.getElementById('userIdInput');
                if (input) {
                    input.value = this.userId;
                }
            }

            async loadArticles() {
                this.showLoading(true);
                this.hideStatus();

                try {
                    const response = await fetch('/api/articles');
                    if (!response.ok) {
                        throw new Error('Failed to load articles');
                    }

                    this.articles = await response.json();
                    this.renderArticles();
                } catch (error) {
                    this.showStatus(`Could not load articles. ${error.message}`, 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            renderArticles() {
                const container = document.getElementById('articlesContainer');
                container.innerHTML = '';

                this.articles.forEach((article, index) => {
                    container.appendChild(this.createArticleCard(article, index));
                });
            }

            createArticleCard(article, index) {
                const card = document.createElement('article');
                card.className = 'article-card';

                const code = `FF-${String(index + 1).padStart(2, '0')}`;
                const tags = article.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                const access = article.isPremium ? 'Premium' : 'Open';
                const action = article.isPremium ? 'Unlock article' : 'Read article';

                card.innerHTML = `
                    <p class="article-index">${code} · ${access}</p>
                    <a class="article-title" href="/article/${article.id}">${article.title}</a>
                    <p class="article-meta">${article.author} · ${new Date(article.publishedAt).toLocaleDateString()}</p>
                    <p class="article-teaser">${article.teaser}</p>
                    <div class="article-tags">${tags}</div>
                    <div class="article-actions">
                        <a class="btn btn-primary btn-read" href="/article/${article.id}">${action}</a>
                    </div>
                `;

                return card;
            }

            showStatus(message, type = 'info') {
                const status = document.getElementById('status');
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
            }

            hideStatus() {
                document.getElementById('status').style.display = 'none';
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
            }
        }

        const app = new ArticleApp();
    </script>
</body>
</html>
