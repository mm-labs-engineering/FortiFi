<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiFi Demo · Paywall hardening</title>
    <link rel="stylesheet" href="/mm-labs-demo.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo"><span>FortiFi</span> demo</div>
                <div class="user-info">
                    <input type="text" id="userIdInput" class="user-id-input" placeholder="User ID" value="demo-user-123">
                    <button id="loadArticlesBtn" class="btn btn-primary">Load articles</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="status" class="status"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading articles...</p>
        </div>
        <div id="articlesContainer" class="articles-grid"></div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>FortiFi · MIT core · <a href="https://labs.40millimeter.com/products/fortifi">Millimeter Labs</a></p>
        </div>
    </footer>

    <script>
        class ArticleApp {
            constructor() {
                this.userId = localStorage.getItem('fortifi_user_id') || 'demo-user-123';
                this.articles = [];
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadArticles();
                this.updateUserIdInput();
            }

            bindEvents() {
                document.getElementById('loadArticlesBtn').addEventListener('click', () => {
                    this.userId = document.getElementById('userIdInput').value.trim();
                    if (!this.userId) {
                        this.showStatus('Please enter a User ID', 'error');
                        return;
                    }
                    localStorage.setItem('fortifi_user_id', this.userId);
                    this.loadArticles();
                });
            }

            updateUserIdInput() {
                const input = document.getElementById('userIdInput');
                if (input) {
                    input.value = this.userId;
                }
            }

            async loadArticles() {
                this.showLoading(true);
                this.hideStatus();

                try {
                    const response = await fetch('/api/articles');
                    if (!response.ok) {
                        throw new Error('Failed to load articles');
                    }

                    this.articles = await response.json();
                    this.renderArticles();
                } catch (error) {
                    this.showStatus(`Error loading articles: ${error.message}`, 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            renderArticles() {
                const container = document.getElementById('articlesContainer');
                container.innerHTML = '';

                this.articles.forEach(article => {
                    container.appendChild(this.createArticleCard(article));
                });
            }

            createArticleCard(article) {
                const card = document.createElement('div');
                card.className = 'article-card';

                const tags = article.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                const premiumBadge = article.isPremium ? '<span class="premium-badge">Premium</span>' : '';

                card.innerHTML = `
                    <div class="article-header">
                        <h3 class="article-title">${article.title}</h3>
                        <div class="article-meta">
                            By ${article.author} · ${new Date(article.publishedAt).toLocaleDateString()}
                        </div>
                    </div>
                    <div class="article-content">
                        ${premiumBadge}
                        <div class="article-teaser">${article.teaser}</div>
                        <div class="article-tags">${tags}</div>
                        <div class="article-actions">
                            <button class="btn btn-primary btn-read" onclick="app.readArticle('${article.id}')">
                                ${article.isPremium ? 'Unlock article' : 'Read article'}
                            </button>
                        </div>
                    </div>
                `;

                return card;
            }

            async readArticle(articleId) {
                try {
                    this.showStatus('Loading article...', 'info');

                    const article = this.articles.find(a => a.id === articleId);

                    if (article && article.isPremium) {
                        const tokenKey = `fortifi_token_${this.userId}_${articleId}`;
                        const tokenData = localStorage.getItem(tokenKey);

                        if (tokenData) {
                            const { token, expiresAt } = JSON.parse(tokenData);
                            if (Date.now() / 1000 < expiresAt) {
                                window.location.href = `/article/${articleId}?token=${token}`;
                                return;
                            }
                        }
                    }

                    window.location.href = `/article/${articleId}`;
                } catch (error) {
                    this.showStatus(`Error: ${error.message}`, 'error');
                }
            }

            showStatus(message, type = 'info') {
                const status = document.getElementById('status');
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
            }

            hideStatus() {
                document.getElementById('status').style.display = 'none';
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
            }
        }

        const app = new ArticleApp();
    </script>
</body>
</html>
