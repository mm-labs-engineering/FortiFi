<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Article · FortiFi demo</title>
    <link rel="stylesheet" href="/mm-labs-demo.css">
</head>
<body>
    <header>
        <div class="container-narrow">
            <div class="header-content">
                <a href="/" class="logo">FortiFi<small>Demo</small></a>
                <a href="/" class="nav-link">Back to articles</a>
            </div>
        </div>
    </header>

    <main class="container-narrow page">
        <div id="status" class="status" role="status"></div>
        <div id="loading" class="loading">
            <div class="spinner" aria-hidden="true"></div>
            <p>Loading article</p>
        </div>

        <article id="articleContainer" class="article-shell" style="display: none;">
            <h1 id="articleTitle"></h1>
            <div id="articleMeta" class="article-meta"></div>
            <div id="articleBody" class="article-content"></div>
        </article>
    </main>

    <footer class="footer">
        <div class="container-narrow">
            <p>FortiFi · MIT core · <a href="https://labs.40millimeter.com/products/fortifi">Millimeter Labs</a></p>
        </div>
    </footer>

    <script>
        class ArticlePage {
            constructor() {
                this.articleId = this.getArticleIdFromUrl();
                this.userId = localStorage.getItem('fortifi_user_id') || 'demo-user-123';
                this.token = this.getStoredToken();
                this.init();
            }

            init() {
                this.loadArticle();
            }

            getArticleIdFromUrl() {
                const match = window.location.pathname.match(/\/article\/(.+)/);
                return match ? match[1] : null;
            }

            tokenKey() {
                return `fortifi_token_${this.userId}_${this.articleId}`;
            }

            getStoredToken() {
                const raw = localStorage.getItem(this.tokenKey());
                if (!raw) return null;
                try {
                    const { token, expiresAt } = JSON.parse(raw);
                    if (Date.now() / 1000 < expiresAt) return token;
                } catch (error) {
                    return null;
                }
                return null;
            }

            async loadArticle() {
                this.showLoading(true);
                this.hideStatus();

                try {
                    const articleResponse = await fetch(`/api/article/${this.articleId}`);
                    if (!articleResponse.ok) {
                        throw new Error('Article not found');
                    }

                    const article = await articleResponse.json();
                    this.renderArticleHeader(article);

                    if (article.isPremium) {
                        if (this.token) {
                            await this.loadFullContent(this.token);
                        } else {
                            this.renderPaywall(article);
                        }
                    } else {
                        this.renderFullContent({ content: article.content });
                    }
                } catch (error) {
                    this.showStatus(error.message, 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            renderArticleHeader(article) {
                document.getElementById('pageTitle').textContent = `${article.title} · FortiFi demo`;
                document.getElementById('articleTitle').textContent = article.title;
                document.getElementById('articleMeta').textContent =
                    `${article.author} · ${new Date(article.publishedAt).toLocaleDateString()} · ${article.category}`;
            }

            renderPaywall(article) {
                document.getElementById('articleBody').innerHTML = `
                    <div class="premium-badge">Premium</div>
                    <p>${article.teaser}</p>
                    <div id="paywall-cta" class="paywall-cta">
                        <h2>Held on the server</h2>
                        <p>The full article is not in this page. Unlock asks for a token, then loads the HTML.</p>
                        <button id="unlock-btn" class="btn btn-primary" type="button">Unlock article</button>
                    </div>
                `;

                document.getElementById('articleContainer').style.display = 'block';
                document.getElementById('unlock-btn').addEventListener('click', () => this.unlockArticle());
            }

            async unlockArticle() {
                const unlockBtn = document.getElementById('unlock-btn');
                unlockBtn.disabled = true;
                unlockBtn.textContent = 'Unlocking...';

                try {
                    const tokenResponse = await fetch('/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            articleId: this.articleId,
                            userId: this.userId,
                        }),
                    });

                    if (!tokenResponse.ok) {
                        const error = await tokenResponse.json();
                        throw new Error(error.error || 'Failed to get access token');
                    }

                    const { token, expiresAt } = await tokenResponse.json();
                    localStorage.setItem(this.tokenKey(), JSON.stringify({ token, expiresAt }));
                    this.token = token;

                    await this.loadFullContent(token);
                    this.showStatus('Article unlocked.', 'success');
                } catch (error) {
                    this.showStatus(`Failed to unlock article. ${error.message}`, 'error');
                    unlockBtn.disabled = false;
                    unlockBtn.textContent = 'Unlock article';
                }
            }

            async loadFullContent(token) {
                const response = await fetch(`/api/article/${this.articleId}/content`, {
                    headers: { Authorization: `Bearer ${token}` },
                });

                if (!response.ok) {
                    if (response.status === 401) throw new Error('Invalid or expired token');
                    throw new Error('Failed to load content');
                }

                this.renderFullContent(await response.json());
            }

            renderFullContent(content) {
                document.getElementById('articleBody').innerHTML = content.content;
                document.getElementById('articleContainer').style.display = 'block';
            }

            showStatus(message, type = 'info') {
                const status = document.getElementById('status');
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
            }

            hideStatus() {
                document.getElementById('status').style.display = 'none';
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
            }
        }

        const articlePage = new ArticlePage();
    </script>
</body>
</html>
