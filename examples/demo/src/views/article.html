<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Article · FortiFi demo</title>
    <link rel="stylesheet" href="/mm-labs-demo.css">
</head>
<body>
    <header>
        <div class="container-narrow">
            <div class="header-content">
                <a href="/" class="logo"><span>FortiFi</span> demo</a>
                <a href="/" class="back-btn">← Back to articles</a>
            </div>
        </div>
    </header>

    <div class="container-narrow">
        <div id="status" class="status"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading article...</p>
        </div>

        <div id="articleContainer" class="article-container" style="display: none;">
            <div class="article-header">
                <h1 id="articleTitle" class="article-title"></h1>
                <div id="articleMeta" class="article-meta"></div>
            </div>
            <div id="articleBody" class="article-content"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container-narrow">
            <p>FortiFi · MIT core · <a href="https://labs.40millimeter.com/products/fortifi">Millimeter Labs</a></p>
        </div>
    </footer>

    <script>
        class ArticlePage {
            constructor() {
                this.articleId = this.getArticleIdFromUrl();
                this.userId = this.getUserIdFromStorage();
                this.token = this.getTokenFromUrl();
                this.init();
            }

            init() {
                this.loadArticle();
            }

            getArticleIdFromUrl() {
                const path = window.location.pathname;
                const match = path.match(/\/article\/(.+)/);
                return match ? match[1] : null;
            }

            getUserIdFromStorage() {
                return localStorage.getItem('fortifi_user_id') || 'demo-user-123';
            }

            getTokenFromUrl() {
                return new URLSearchParams(window.location.search).get('token');
            }

            async loadArticle() {
                this.showLoading(true);
                this.hideStatus();

                try {
                    const articleResponse = await fetch(`/api/article/${this.articleId}`);
                    if (!articleResponse.ok) {
                        throw new Error('Article not found');
                    }

                    const article = await articleResponse.json();
                    this.renderArticleHeader(article);

                    if (article.isPremium) {
                        if (this.token) {
                            await this.loadFullContent(this.token);
                        } else {
                            await this.handlePremiumContent();
                        }
                    } else {
                        await this.loadFullContent();
                    }
                } catch (error) {
                    this.showStatus(`Error loading article: ${error.message}`, 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            renderArticleHeader(article) {
                document.getElementById('pageTitle').textContent = `${article.title} · FortiFi demo`;
                document.getElementById('articleTitle').textContent = article.title;

                document.getElementById('articleMeta').innerHTML = `
                    <span>By ${article.author}</span>
                    <span>·</span>
                    <span>${new Date(article.publishedAt).toLocaleDateString()}</span>
                    <span>·</span>
                    <span>${article.category}</span>
                `;
            }

            async handlePremiumContent() {
                const articleResponse = await fetch(`/api/article/${this.articleId}`);
                const article = await articleResponse.json();

                document.getElementById('articleBody').innerHTML = `
                    <div class="premium-badge">Premium</div>
                    <p>${article.teaser}</p>
                    <div id="paywall-cta" class="paywall-cta">
                        <h3>Premium content</h3>
                        <p>Full HTML loads only after the server validates a short-lived token.</p>
                        <button id="unlock-btn" class="btn btn-primary">Unlock article</button>
                    </div>
                `;

                document.getElementById('articleContainer').style.display = 'block';
                document.getElementById('unlock-btn').addEventListener('click', () => this.unlockArticle());
            }

            async unlockArticle() {
                const unlockBtn = document.getElementById('unlock-btn');
                unlockBtn.disabled = true;
                unlockBtn.textContent = 'Unlocking...';

                try {
                    const tokenResponse = await fetch('/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            articleId: this.articleId,
                            userId: this.userId,
                        }),
                    });

                    if (!tokenResponse.ok) {
                        const error = await tokenResponse.json();
                        throw new Error(error.error || 'Failed to get access token');
                    }

                    const { token, expiresAt } = await tokenResponse.json();
                    const tokenKey = `fortifi_token_${this.userId}_${this.articleId}`;
                    localStorage.setItem(tokenKey, JSON.stringify({ token, expiresAt }));

                    await this.loadFullContent(token);
                    this.showStatus('Article unlocked successfully.', 'success');
                } catch (error) {
                    this.showStatus(`Failed to unlock article: ${error.message}`, 'error');
                    unlockBtn.disabled = false;
                    unlockBtn.textContent = 'Unlock article';
                }
            }

            async loadFullContent(token = null) {
                if (!token) {
                    const response = await fetch(`/api/article/${this.articleId}`);
                    if (!response.ok) throw new Error('Failed to load article');
                    const article = await response.json();
                    this.renderFullContent({ content: article.content });
                    return;
                }

                const response = await fetch(`/api/article/${this.articleId}/content`, {
                    headers: { Authorization: `Bearer ${token}` },
                });

                if (!response.ok) {
                    if (response.status === 401) throw new Error('Invalid or expired token');
                    if (response.status === 403) throw new Error('Access denied');
                    throw new Error('Failed to load content');
                }

                this.renderFullContent(await response.json());
            }

            renderFullContent(content) {
                document.getElementById('articleBody').innerHTML = content.content;
                document.getElementById('articleContainer').style.display = 'block';
            }

            showStatus(message, type = 'info') {
                const status = document.getElementById('status');
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
            }

            hideStatus() {
                document.getElementById('status').style.display = 'none';
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
            }
        }

        const articlePage = new ArticlePage();
    </script>
</body>
</html>
